name: Job Runner Cron

on:
  schedule:
    # every 2 minutes
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase job_runner
        env:
          JOB_RUNNER_URL: ${{ secrets.JOB_RUNNER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "Calling job_runner..."
          resp="$(curl -sS -X POST "$JOB_RUNNER_URL" \
            -H "content-type: application/json" \
            -H "x-cron-secret: $CRON_SECRET")"
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || (echo "job_runner failed" && exit 1)
